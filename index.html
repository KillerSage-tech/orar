<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orari MSMU 1A</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e7c7b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f5f5;--card:#fff;--ink:#1c2626;--mut:#667070;--line:#d9dede;--L:#d6d6d6;--Lt:#1c2626;--S:#6f6f6f;--St:#fff;--acc:#0e7c7b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1717;--card:#172121;--ink:#e8f0f0;--mut:#93a3a3;--line:#2a3838;--L:#a4adad;--Lt:#101818;--S:#4a5454;--acc:#4cc3c1}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 14px 40px}
h1{margin:0 0 14px;font-size:24px}
.tabs{display:flex;gap:6px;margin-bottom:18px}
.tab{flex:1;padding:12px 0;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:600 16px inherit;font-family:inherit;cursor:pointer}
.tab[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.tab:focus-visible{outline:3px solid #e8a317;outline-offset:2px}
h2{margin:0 0 14px;font-size:22px}
.card{border-radius:16px;padding:18px 20px;margin-bottom:12px}
.card.L{background:var(--L);color:var(--Lt)}
.card.S{background:var(--S);color:var(--St)}
.kind{font-size:15px;font-weight:700}
.name{font-size:28px;font-weight:800;margin:2px 0}
.info{font-size:18px}
.empty{padding:30px 10px;text-align:center;color:var(--mut)}
.top{display:flex;gap:8px;margin-bottom:16px}
.seg{flex:1;padding:12px 0;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:700 16px inherit;font-family:inherit;cursor:pointer}
.seg[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.seg:focus-visible,.pb:focus-visible,.x:focus-visible,.mini:focus-visible{outline:3px solid #e8a317;outline-offset:2px}
.mini{margin-top:10px;padding:8px 14px;border-radius:10px;border:2px solid currentColor;background:transparent;color:inherit;font:600 15px inherit;font-family:inherit;cursor:pointer}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.sec h3{margin:0 0 10px;font-size:20px}
.pr{display:flex;gap:8px;margin-bottom:8px}
.pb{flex:1;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 17px inherit;font-family:inherit;cursor:pointer}
.x{width:44px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--mut);font-size:18px;cursor:pointer}
.add{display:inline-block;margin-top:4px;padding:10px 16px;border-radius:12px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer}
.add input{position:absolute;opacity:0;width:1px;height:1px}
.add:focus-within{outline:3px solid #e8a317;outline-offset:2px}
.msg{color:var(--mut);font-size:15px;margin:6px 0}
#viewer{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#viewer.on{display:flex}
#viewer header{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
#viewer header span{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#viewer a,#viewer button{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px inherit;font-family:inherit;text-decoration:none;cursor:pointer}
#viewer iframe{flex:1;border:0;width:100%;background:#fff;margin-bottom:env(safe-area-inset-bottom,0px)}
.leg{display:flex;gap:18px;margin-top:22px;color:var(--mut);font-size:15px}
.leg i{display:inline-block;width:16px;height:16px;border-radius:4px;vertical-align:-3px;margin-right:6px;border:1px solid rgba(0,0,0,.25)}
</style>
</head>
<body>
<main>
  <h1>Orari im</h1>
  <div class="top"><button class="seg" id="v1" aria-pressed="true">Orari</button><button class="seg" id="v2" aria-pressed="false">Leksionet PDF</button></div>
  <div id="orari">
  <div class="tabs" role="tablist" id="tabs"></div>
  <h2 id="title"></h2>
  <div id="list"></div>
  </div>
  <div id="pdf" hidden></div>
  <div class="leg"><span><i style="background:var(--L)"></i>Leksion</span><span><i style="background:var(--S)"></i>Seminar</span></div>
</main>
<div id="viewer" role="dialog" aria-label="Lexuesi i PDF"><header><span id="vt"></span><a id="vo" target="_blank" rel="noopener">Hap veç</a><button id="vc">Mbyll</button></header><iframe id="vf" title="PDF"></iframe></div>
<script>
const DAYS=["E hënë","E martë","E mërkurë","E enjte","E premte"],SH=["Hën","Mar","Mër","Enj","Pre"],TY={L:"Leksion",S:"Seminar"};
const B=[
 {d:0,s:8,e:10,t:"L",n:"VepShEnUj",r:"FIMIF 127"},{d:0,s:10,e:12,t:"S",n:"VepShEnUj",r:"FIMIF 127"},
 {d:1,s:8,e:10,t:"L",n:"BioUji",r:"ENB 206"},{d:1,s:10,e:12,t:"S",n:"BioUji",r:"ENB 206"},
 {d:2,s:12,e:14,t:"L",n:"GjeotMjed",r:"BA 210"},{d:2,s:14,e:16,t:"S",n:"GjeotMjed",r:"BA 210"},
 {d:3,s:8,e:10,t:"L",n:"SisPellUji",r:"Lab"},{d:3,s:10,e:12,t:"S",n:"SisPellUji",r:"Lab"},
 {d:3,s:12,e:14,t:"L",n:"NjStrNd",r:"ENB 207"},
 {d:4,s:8,e:9,t:"L",n:"NjStrNd",r:"ENB 207"},
 {d:4,s:12,e:14,t:"L",n:"DinUjiNen",r:"ENB 201"},{d:4,s:14,e:16,t:"S",n:"DinUjiNen",r:"ENB 201"}
];
const p2=n=>String(n).padStart(2,"0");
const today=(new Date().getDay()+6)%7;
function firstDay(){const h=new Date().getHours();for(let k=0;k<7;k++){const d=(today+k)%7;if(d>4)continue;if(B.some(x=>x.d===d&&(k>0||x.e>h)))return d}return 0}
let sel=firstDay();
function show(){
  const tabs=document.getElementById("tabs");tabs.innerHTML="";
  SH.forEach((s,i)=>{const b=document.createElement("button");b.className="tab";b.textContent=s;
    b.setAttribute("role","tab");b.setAttribute("aria-selected",i===sel);b.setAttribute("aria-label",DAYS[i]);
    b.onclick=()=>{sel=i;show()};tabs.append(b)});
  document.getElementById("title").textContent=(["Sot, ","Nesër, "][(sel-today+7)%7]||"")+DAYS[sel];
  const L=document.getElementById("list"),items=B.filter(x=>x.d===sel);
  L.innerHTML=items.length?"":'<div class="empty">Nuk ke orë këtë ditë.</div>';
  items.forEach(x=>{const c=document.createElement("div");c.className="card "+x.t;
    c.innerHTML=`<div class="kind">${TY[x.t]}</div><div class="name">${x.n}</div><div class="info">${p2(x.s)}:00–${p2(x.e)}:00 · ${x.r}</div>`;
    const m=document.createElement("button");m.className="mini";m.textContent="📄 Leksionet e lëndës";
    m.onclick=()=>go("pdf",x.n);c.append(m);
    L.append(c)});
}
const $=i=>document.getElementById(i);
let cur=null,view="orari",pdfs=[],dbx=null,asx=null,msg="";
function go(v,course){view=v;$("orari").hidden=v!=="orari";$("pdf").hidden=v!=="pdf";
  $("v1").setAttribute("aria-pressed",v==="orari");$("v2").setAttribute("aria-pressed",v==="pdf");
  if(v==="pdf"){drawPdf();if(course){const e=$("c-"+course);if(e)e.scrollIntoView({block:"start"})}}}
$("v1").onclick=()=>go("orari");$("v2").onclick=()=>go("pdf");
const courses=[...new Set(B.map(x=>x.n))];
function openPdf(p){if(cur)URL.revokeObjectURL(cur);cur=URL.createObjectURL(p.blob);$("vt").textContent=p.name;$("vf").src=cur;$("vo").href=cur;$("viewer").classList.add("on")}
$("vc").onclick=()=>{$("viewer").classList.remove("on");$("vf").src="about:blank"};
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open("orari",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("pdfs",{keyPath:"id",autoIncrement:true});
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function rq(mode,fn){return idb().then(d=>new Promise((res,rej)=>{const t=d.transaction("pdfs",mode),r=fn(t.objectStore("pdfs"));
  t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error)}))}
async function load(){
  try{const all=await rq("readonly",s=>s.getAll());
    pdfs=all.map(p=>Object.assign(p,{docId:p.id})).sort((a,b)=>String(a.name).localeCompare(String(b.name)))}
  catch(e){msg="Nuk u ngarkuan PDF-të."}
  drawPdf()}
async function upload(course,files){
  try{for(const f of files)await rq("readwrite",s=>s.add({course,name:f.name.replace(/\.pdf$/i,""),blob:f}));msg=""}
  catch(e){msg="Ruajtja dështoi. Mund të mos ketë mjaft vend në telefon."}
  await load()}
async function del(p){
  if(!confirm("Të fshihet \""+p.name+"\"?"))return;
  try{await rq("readwrite",s=>s.delete(p.id))}catch(e){msg="Fshirja dështoi."}
  await load()}
function drawPdf(){
  const P=$("pdf");P.innerHTML="";
  if(!dbx){P.innerHTML='<div class="empty">Ruajtja e PDF-ve nuk është e disponueshme në këtë pamje. Hape faqen nga llogaria jote në Claude.</div>';return}
  if(msg){const m=document.createElement("p");m.className="msg";m.textContent=msg;P.append(m)}
  courses.forEach(c=>{
    const sec=document.createElement("div");sec.className="sec";sec.id="c-"+c;
    const h=document.createElement("h3");h.textContent=c;sec.append(h);
    const mine=pdfs.filter(p=>p.course===c);
    if(!mine.length){const e=document.createElement("p");e.className="msg";e.textContent="Ende nuk ka PDF.";sec.append(e)}
    mine.forEach(p=>{
      const r=document.createElement("div");r.className="pr";
      const b=document.createElement("button");b.className="pb";b.textContent="📄 "+p.name;b.onclick=()=>openPdf(p);r.append(b);
      if(asx){const x=document.createElement("button");x.className="x";x.textContent="🗑";x.setAttribute("aria-label","Fshi "+p.name);x.onclick=()=>del(p);r.append(x)}
      sec.append(r)});
    if(asx){const l=document.createElement("label");l.className="add";l.append("+ Shto PDF");
      const i=document.createElement("input");i.type="file";i.accept="application/pdf";i.multiple=true;
      i.onchange=()=>{if(i.files.length)upload(c,[...i.files])};l.append(i);sec.append(l)}
    P.append(sec)})}
dbx=!!window.indexedDB;asx=dbx;
if(dbx)load();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
show();
</script>
</body>
</html>
